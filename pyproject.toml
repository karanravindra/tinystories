[project]
name = "tinystories"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karan Ravindra", email = "21176108+karanravindra@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cut-cross-entropy>=25.1.1",
    "datasets>=5.1.0",
    "gigatoken>=0.11.0",
    "matplotlib>=3.11.2",
    "scienceplots>=2.2.2",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "torchinfo>=1.8.0",
    "tqdm>=4.70.1",
    "tyro>=1.0.17",
    "wandb>=0.31.0",
]

[project.scripts]
tinystories = "tinystories.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
